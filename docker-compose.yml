services:
  pansaver:
    build: .
    image: pansaver:latest
    container_name: pansaver
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      PORT: 8080
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
